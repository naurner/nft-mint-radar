chain:
  name: robinhood
  # Заполняется мастером `python -m wlparser setup`.
  rpc_url: ""
  chain_id: null
  # Нужен только для ссылок в алертах, например https://explorer.example
  explorer_url: ""
  # Как часто спрашивать сеть о новых блоках, в секундах.
  poll_interval_s: 2.0
  # Сколько минтов в одном блоке считать всплеском активности.
  surge_threshold: 25
  # Отставание от головы цепи: защита от реорганизаций блоков.
  confirmations: 2

# Главные ручки против шума.
mint:
  # Сколько РАЗНЫХ кошельков должны сминтить, прежде чем придёт алерт.
  # Первый минт ничего не значит: так выглядит и тест разработчика.
  # Меньше 10 — начнёт залетать мусор, больше 30 — узнаешь позже всех.
  min_unique_minters: 10
  # За какое время эти кошельки должны набраться. Если контракт набирает
  # их месяцами — это не раздача, а вялотекущая жизнь служебного контракта.
  window_minutes: 120
  # Адреса, про которые не сообщать никогда. Сюда можно добавить то,
  # что всё равно прорвалось через фильтр по названию.
  ignore_contracts: []
  # Оставь пустым (не указывай), чтобы использовать встроенный список
  # служебных NFT: позиции ликвидности, домены, стейкинг-бейджи и прочее.
  # ignore_name_patterns: []

alerts:
  # Порог отправки в Telegram. Всё, что ниже, молча пишется в базу
  # и доступно через `python -m wlparser recent`.
  min_score: 45
  # Сообщать о деплое новых контрактов. Это самый ранний сигнал,
  # но и самый шумный: контракт может так и не начать минт.
  notify_deploys: true
  notify_mints: true
  # Фора владельца перед остальными подписчиками, в секундах.
  # Бот публичный, поэтому это решает, кто увидит находку первым.
  # 0 — всем одновременно; 30 — у тебя полминуты преимущества.
  owner_head_start_s: 0

twitter:
  # Включается после `python -m wlparser twitter-add`.
  enabled: false
  # Поисковые запросы. Синтаксис — как в поиске X.
  queries:
    - '"robinhood chain" (whitelist OR WL OR mint) -filter:retweets'
    - 'robinhoodchain (mint OR whitelist OR WL) -filter:retweets'
    - '"robinhood chain" nft (drop OR launch OR live) -filter:retweets'
    - '#RobinhoodChain -filter:retweets'
  # Аккаунты, чью ленту читать целиком. Заполняется по мере того,
  # как станет видно, кто пишет о проектах раньше остальных.
  watchlist: []
  # Интервалы намеренно неровные, к ним добавляется случайный разброс:
  # ровный опрос выглядит машинным и повышает риск блокировки аккаунта.
  search_interval_s: 240
  watchlist_interval_s: 75
  per_query_limit: 20
  accounts_db: data/twscrape_accounts.db
  # Юзернейм аккаунта из accounts_db, от имени которого публиковать посты
  # в X (poster ниже). Пусто — автопост не работает, даже если poster.enabled:
  # постить случайным/чужим аккаунтом не надо.
  post_as: ""

# Автопост находок в X — только собственные он-чейн факты (всплеск минта,
# приближение к распродаже — см. poster/caption.py::POSTABLE_KINDS),
# никогда чужой текст из твиттера как свой пост. Публикуется сам, без
# подтверждения; отбор по качеству (ИИ-порог "стоит ли постить"), не по
# счётчику.
poster:
  enabled: false
  # Пусто/null — без ограничения, отбирает качественный порог. Число —
  # дополнительный потолок в сутки сверху.
  max_posts_per_day: null
  # Цитирования чужих твитов (см. "Автопост в X" в README) — отдельный,
  # более консервативный лимит по умолчанию.
  max_quotes_per_day: 5

# Локальная модель на самом Маке (Ollama) — бесплатно, без ключей. Пока что
# пишет тексты для постов в X (см. poster выше): факт из алерта переписывается
# живее, а ссылку и хэштеги, как и раньше, добавляет код, не модель. Если модель
# не отвечает или выдала что-то подозрительное (ссылку, цифру, которой не было
# в факте) — берётся обычный шаблонный текст, ничего не ломается.
# Тот же способ подключения, что в проекте Lalascaner: Ollama стоит на Маке,
# не в Docker, а контейнер достаёт её по имени host.docker.internal.
# Жива ли она — видно в боте: /menu → Статус.
llm:
  enabled: true
  base_url: http://host.docker.internal:11434/v1
  # Пусто — взять первую подходящую из скачанных (`ollama list`).
  # Хочешь конкретную — впиши, например: llama3.1 или qwen2.5:14b
  # Проще всего задать командой, не редактируя этот файл: mac-llm-model.command
  model: ""
  # Модель ещё и решает, не спам ли алерт (вместе с обычными фильтрами
  # выше) — она пропускает всё, что не смогла явно опознать как мусор.
  # false — оставить только генерацию текста постов, без отсева алертов.
  filter_alerts: true

# Мгновенно шлётся только срочное — всплеск минта и почти распродано
# (см. Pipeline.URGENT_KINDS в pipeline/runner.py), там счёт на минуты.
# Всё остальное (начало минта, анонсы в твиттере) копится и приходит
# пачкой в эти моменты. Время — по часовому поясу контейнера (TZ в
# docker-compose.yml), не UTC.
digest:
  enabled: true
  times: ["00:00", "02:00", "04:00", "06:00", "08:00", "10:00",
          "12:00", "14:00", "16:00", "18:00", "20:00", "22:00"]

# Ссылки и соцсети проектов в уведомлениях.
links:
  # OpenSea требует ключ для API с сентября 2026 года. Без ключа ссылка на
  # коллекцию всё равно есть (строится из адреса контракта), но соцсети
  # проекта и живой флор на вторичке — только с ключом.
  # Бесплатный ключ: opensea.io/account/developer
  opensea_api_key: ""

# Живая карточка: цена минта, сколько сминчено, флор — обновляется в уже
# отправленном сообщении вместо новых. Прогресс минта работает без ключа
# OpenSea, флор и число держателей — только с ним.
tracking:
  enabled: true
  # Обычный темп проверки одного проекта, в секундах. Настоящая частота у
  # каждого проекта своя и зависит от того, сколько уже разобрано — близко
  # к распродаже проверяется чаще этого, коллекция, которую вяло разбирают
  # по 1-2%, — заметно реже (см. tracking/service.py::_FILL_INTERVAL_TIERS).
  refresh_interval_s: 300
  # Как часто цикл вообще просыпается посмотреть, кому пора — короче
  # refresh_interval_s специально, иначе проверять чаще базовой ставки было
  # бы просто нечем.
  poll_interval_s: 60
  # Дольше этого коллекцию не трогаем. Заброшенные отваливаются раньше
  # сами через stale_after_checks — это только потолок для тех, что
  # всё ещё меняются.
  max_duration_hours: 720
  # Если цифры не меняются столько проверок подряд, слежение
  # останавливается само.
  stale_after_checks: 12
  # Пауза между проверками разных проектов внутри одного цикла, в секундах.
  # Без неё проверка десятка проектов подряд — это залп RPC-запросов за
  # долю секунды, который сеть режет как всплеск, и часть карточек
  # молча остаётся без обновления.
  check_delay_s: 0.5
  # Как часто заново спрашивать у OpenSea последнюю/макс. продажу, в секундах.
  # Не обязаны быть свежее пяти минут, а лишний запрос на каждый тик каждого
  # проекта удваивает нагрузку на лимит частоты OpenSea.
  sales_cache_ttl_s: 900
  # Резерв: если контракт сам не выдал цену минта, попробовать найти её на
  # сайте проекта (ищет "price"/"mint price" рядом с числом в ETH). Грубая
  # эвристика на лучший случай, не надёжный парсер — если сайт рисует цену
  # через JavaScript или её там просто нет, ничего не найдёт, и это норма.
  website_price_fallback_enabled: true
  website_price_cache_ttl_s: 3600

# Локальный файл по умолчанию. Один и тот же бот не может работать
# на двух устройствах сразу (Telegram это не разрешает), но если хочешь,
# чтобы история находок и цен была ОБЩЕЙ независимо от того, где сейчас
# запущен бот — заполни db_url, и данные пойдут в Turso вместо файла.
# Проверить перед тем как вписывать: `python -m wlparser db-probe <url>`
# Токен — не сюда, а в .env как DB_AUTH_TOKEN (это секрет).
db_path: data/wlparser.sqlite
db_url: ""

# Перевод цены минта в доллары — необязательно, работает без ключей.
# Курс ETH/USD — с CoinGecko. Комиссия сети — грубая оценка (условный
# расход газа * текущая gasPrice), не точный расчёт под конкретный контракт.
pricing:
  enabled: true
  refresh_interval_s: 180
  include_gas: true
  gas_per_mint: 150000
