[project]
name = "wlparser"
version = "0.1.0"
description = "Парсер новых WL-раздач и минтов в сети Robinhood Chain"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "aiogram>=3.7",
    "eth-utils>=4.1",
    "eth-hash[pycryptodome]>=0.7",
    "typer>=0.12",
    "rich>=13.7",
    "twscrape>=0.17",
    "libsql-client>=0.3",
    "twikit",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
wlparser = "wlparser.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
